
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">

    <!-- Twinkling stars background -->
    <div class="stars" aria-hidden="true"></div>

    <!-- Top-right controls -->
    <header class="top-controls">

        <select id="themePicker" aria-label="Select theme">
            <option value="dark">Dark Mode</option>
            <option value="light">Light Mode</option>
        </select>

        <div class="language-control">
            <input
                type="text"
                id="languagePicker"
                list="languageList"
                placeholder="Search language"
                value="English"
                autocomplete="off"
                aria-label="Search and select language"
            >

            <datalist id="languageList">
                <option value="English"></option>
                <option value="Hindi"></option>
                <option value="French"></option>
                <option value="Spanish"></option>
                <option value="German"></option>
                <option value="Italian"></option>
                <option value="Portuguese"></option>
                <option value="Arabic"></option>
                <option value="Bengali"></option>
                <option value="Chinese"></option>
                <option value="Japanese"></option>
                <option value="Korean"></option>
                <option value="Russian"></option>
                <option value="Urdu"></option>
                <option value="Tamil"></option>
                <option value="Telugu"></option>
                <option value="Marathi"></option>
                <option value="Gujarati"></option>
                <option value="Punjabi"></option>
            </datalist>
        </div>

    </header>


    <!-- Main application -->
    <main class="container">

        <h1 id="pageTitle">Currency Converter</h1>

        <!-- Single converter card -->
        <section class="converter">

            <label for="amount" id="amountLabel">Amount</label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0"
                step="any"
            >


            <label for="fromCurrency" id="fromLabel">From</label>

            <select id="fromCurrency">
                <option value="INR">Indian Rupee (INR)</option>
                <option value="USD">US Dollar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">British Pound (GBP)</option>
            </select>


            <button id="swapBtn" type="button">⇄ Swap</button>


            <label for="toCurrency" id="toLabel">To</label>

            <select id="toCurrency">
                <option value="USD">US Dollar (USD)</option>
                <option value="INR">Indian Rupee (INR)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">British Pound (GBP)</option>
            </select>


            <button id="convertBtn" type="button">Convert</button>


            <div id="result" aria-live="polite">

                <div id="convertedResult" data-status="default">
                    Result will appear here
                </div>

                <div id="exchangeRate"></div>

            </div>

        </section>

        <p class="footer-text">
            Simple • Smart • Global Currency Conversion
        </p>

    </main>


    <script src="script.js"></script>

</body>
</html>
